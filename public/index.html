<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revelação de cartas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3eee4;--ink:#1d1b22;--muted:#6b6672;--velvet:#a3213f;--velvet2:#6d1429;--gold:#d9a93b;--panel:#fffaf0;--line:#d8cfbd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13181f;--ink:#f1ece0;--muted:#9a95a3;--velvet:#c2304f;--velvet2:#7c1830;--gold:#e8bb4d;--panel:#1c232c;--line:#2e3743}}
:root[data-theme="dark"]{--bg:#13181f;--ink:#f1ece0;--muted:#9a95a3;--velvet:#c2304f;--velvet2:#7c1830;--gold:#e8bb4d;--panel:#1c232c;--line:#2e3743}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;min-height:100vh}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:22px clamp(16px,4vw,40px);border-bottom:1px solid var(--line)}
h1{margin:0;font-size:clamp(1.4rem,3vw,2rem);font-weight:800;letter-spacing:-.02em}
.sub{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.btn,.secret{font:inherit;font-weight:600;font-size:.95rem;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
button:hover,.btn:hover{border-color:var(--gold)}
button:focus-visible,.btn:focus-within,.card:focus-visible,.secret:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.primary{background:var(--velvet);border-color:var(--velvet);color:#fff}
.primary:hover{border-color:var(--gold)}
.btn input{position:absolute;opacity:0;width:0;height:0}
.secret{cursor:text;width:11rem}
main{padding:clamp(16px,4vw,40px)}
.count{color:var(--muted);margin:0 0 18px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{position:relative;aspect-ratio:3/4;perspective:900px;cursor:pointer;border:0;padding:0;background:none;border-radius:14px}
.inner{position:absolute;inset:0;transition:transform .8s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.06) 10px 11px),linear-gradient(160deg,var(--velvet),var(--velvet2));border:2px solid var(--gold);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.back::after{content:"";position:absolute;inset:8px;border:1px solid color-mix(in srgb,var(--gold) 60%,transparent);border-radius:9px}
.num{font-size:clamp(2.4rem,6vw,3.4rem);font-weight:800;color:var(--gold);z-index:1}
.front{transform:rotateY(180deg);background:var(--panel);border:2px solid var(--gold)}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.card:not(.done):hover .inner{transform:translateY(-6px) rotateZ(-1.5deg)}
.empty{border:2px dashed var(--line);border-radius:16px;padding:48px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.2rem;margin-bottom:6px}
#overlay{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,10,14,.82);padding:20px}
#overlay.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.stage{width:min(88vw,calc(78vh * .75));aspect-ratio:3/4;perspective:1400px;position:relative}
.sinner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.25,.8,.25,1);transform:rotateY(0) scale(.9)}
.stage.flip .sinner{transform:rotateY(180deg) scale(1)}
.stage .face{border-radius:18px}
.stage .back{box-shadow:0 20px 60px rgba(0,0,0,.5)}
.stage .num{font-size:6rem}
.stage .front{box-shadow:0 0 0 4px var(--gold),0 0 80px rgba(232,187,77,.45)}
.stage .front img{object-fit:contain;background:#000}
.close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.hint{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#d6d1c8;font-size:.9rem}
.spark{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:var(--gold);pointer-events:none;animation:burst 1.1s ease-out forwards}
@keyframes burst{from{transform:translate(-50%,-50%) scale(1);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.inner,.sinner{transition-duration:.01s}.spark{display:none}#overlay.on{animation:none}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Revelação de cartas</h1>
    <p class="sub">Escolha uma carta, ou sorteie, e descubra a imagem. As fotos ficam salvas nesta aplicação.</p>
  </div>
  <div class="bar">
    <input id="password" class="secret" type="password" placeholder="Senha de edição" autocomplete="current-password" hidden>
    <label class="btn">Adicionar imagens<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label>
    <button id="draw" class="primary">Sortear carta</button>
    <button id="shuffle">Embaralhar</button>
    <button id="reset">Virar todas para baixo</button>
    <button id="clear">Remover imagens</button>
  </div>
</header>
<main>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>
</main>
<div id="overlay" role="dialog" aria-modal="true" aria-label="Carta revelada">
  <button class="close" id="close">Fechar</button>
  <div class="stage" id="stage">
    <div class="sinner">
      <div class="face back"><span class="num" id="snum"></span></div>
      <div class="face front"><img id="simg" alt="Imagem revelada"></div>
    </div>
  </div>
  <div class="hint">Clique fora da carta ou pressione Esc para voltar</div>
</div>
<script>
(function(){
  var items=[];
  var grid=document.getElementById("grid"), count=document.getElementById("count");
  var overlay=document.getElementById("overlay"), stage=document.getElementById("stage");
  var simg=document.getElementById("simg"), snum=document.getElementById("snum");
  var passwordInput=document.getElementById("password");
  var current=null, lastFocus=null, sig=null;

  function password(){return sessionStorage.getItem("cartas-senha")||""}
  function setMessage(text){count.textContent=text}

  function api(path, opts){
    opts=opts||{};
    var headers=Object.assign({}, opts.headers||{});
    if(password()) headers.Authorization="Bearer "+password();
    opts.headers=headers;
    return fetch(path, opts).then(function(res){
      var type=res.headers.get("content-type")||"";
      var parse=type.indexOf("json")>=0?res.json():Promise.resolve(null);
      return parse.then(function(body){
        if(res.status===401){
          passwordInput.hidden=false;
          passwordInput.focus();
          throw new Error((body&&body.error)||"Senha necessária para alterar as cartas");
        }
        if(!res.ok) throw new Error((body&&body.error)||"Não foi possível concluir");
        return body;
      });
    });
  }

  function signature(list){
    return list.map(function(i){return i.id+(i.done?"1":"0")}).join("|");
  }

  function render(){
    sig=signature(items);
    grid.innerHTML="";
    var left=items.filter(function(i){return !i.done}).length;
    count.textContent=items.length?(left+" de "+items.length+" cartas ainda fechadas"):"";
    if(!items.length){
      var e=document.createElement("div");e.className="empty";
      e.innerHTML="<strong>Nenhuma imagem ainda</strong>Use “Adicionar imagens”. As fotos ficam salvas nesta aplicação, mesmo depois de atualizar a página.";
      grid.style.display="block";grid.appendChild(e);return;
    }
    grid.style.display="";
    items.forEach(function(it,idx){
      var b=document.createElement("button");
      b.className="card"+(it.done?" done":"");
      b.setAttribute("aria-label","Carta "+(idx+1)+(it.done?", já revelada":""));
      b.innerHTML='<div class="inner"><div class="face back"><span class="num">'+(idx+1)+'</span></div><div class="face front"><img alt="Carta '+(idx+1)+' revelada"></div></div>';
      b.querySelector("img").src=it.url;
      b.addEventListener("click",function(){open(it,idx)});
      grid.appendChild(b);
    });
  }

  function applyCards(list){
    var next=list||[];
    if(signature(next)===sig) return;
    items=next;
    render();
  }

  function load(){
    if(overlay.classList.contains("on")) return Promise.resolve();
    return api("/api/cards").then(function(data){applyCards(data.cards)}).catch(function(err){setMessage(err.message)});
  }

  function burst(){
    for(var i=0;i<28;i++){
      var s=document.createElement("span");s.className="spark";
      var a=Math.random()*Math.PI*2,d=140+Math.random()*220;
      s.style.setProperty("--dx",Math.cos(a)*d+"px");
      s.style.setProperty("--dy",Math.sin(a)*d+"px");
      s.style.animationDelay=(Math.random()*.15)+"s";
      stage.appendChild(s);
      setTimeout(function(el){return function(){el.remove()}}(s),1400);
    }
  }

  function open(it,idx){
    current=it;lastFocus=document.activeElement;
    simg.src=it.url;snum.textContent=idx+1;
    stage.classList.remove("flip");
    overlay.classList.add("on");
    void stage.offsetWidth;
    var wasDone=it.done;
    setTimeout(function(){stage.classList.add("flip");if(!wasDone)setTimeout(burst,500)},wasDone?50:350);
    document.getElementById("close").focus();
  }

  function close(){
    if(!current)return;
    var id=current.id;
    current.done=true;
    current=null;
    overlay.classList.remove("on");
    render();
    api("/api/cards/"+id+"/reveal",{method:"POST"}).then(function(data){applyCards(data.cards)}).catch(function(err){setMessage(err.message)});
    if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}
  }

  document.getElementById("file").addEventListener("change",function(e){
    var files=e.target.files;
    if(!files.length)return;
    var body=new FormData();
    Array.prototype.forEach.call(files,function(f){body.append("images",f)});
    e.target.value="";
    setMessage("Enviando imagens…");
    api("/api/cards",{method:"POST",body:body}).then(function(data){applyCards(data.cards)}).catch(function(err){setMessage(err.message)});
  });
  document.getElementById("draw").addEventListener("click",function(){
    var closed=items.map(function(it,i){return {it:it,i:i}}).filter(function(x){return !x.it.done});
    if(!closed.length){setMessage(items.length?"Todas as cartas já foram reveladas. Use “Virar todas para baixo” para recomeçar.":"Adicione imagens primeiro.");return}
    var p=closed[Math.floor(Math.random()*closed.length)];open(p.it,p.i);
  });
  document.getElementById("shuffle").addEventListener("click",function(){
    api("/api/cards/shuffle",{method:"POST"}).then(function(data){applyCards(data.cards)}).catch(function(err){setMessage(err.message)});
  });
  document.getElementById("reset").addEventListener("click",function(){
    api("/api/cards/reset",{method:"POST"}).then(function(data){applyCards(data.cards)}).catch(function(err){setMessage(err.message)});
  });
  document.getElementById("clear").addEventListener("click",function(){
    if(!items.length||!confirm("Remover todas as imagens salvas nesta aplicação?"))return;
    api("/api/cards",{method:"DELETE"}).then(function(data){applyCards(data.cards)}).catch(function(err){setMessage(err.message)});
  });
  passwordInput.addEventListener("input",function(){
    sessionStorage.setItem("cartas-senha",passwordInput.value);
  });
  passwordInput.addEventListener("change",function(){load()});
  document.getElementById("close").addEventListener("click",close);
  overlay.addEventListener("click",function(e){if(e.target===overlay)close()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});

  render();
  api("/api/config").then(function(cfg){
    if(cfg.adminRequired){
      passwordInput.hidden=false;
      if(password()) passwordInput.value=password();
    }
  }).catch(function(){}).then(load);
  setInterval(function(){if(!document.hidden)load()},3000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
})();
</script>
</body>
</html>
